name: unpub_next
description: Self-hosted private Dart Pub server for Enterprise, with a simple web interface to search and view packages information. Fork of pd4d10/unpub with modernized dependencies and Dart 3 support.
version: 3.1.0
homepage: https://github.com/AlBlanc/unpub
repository: https://github.com/AlBlanc/unpub
issue_tracker: https://github.com/AlBlanc/unpub/issues
environment:
  sdk: ^3.8.0
executables:
  unpub_next: unpub_next
  unpub: unpub_next
dependencies:
  args: ^2.5.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http_parser: ^4.0.2
  http: ^1.2.0
  archive: ^3.6.1
  logging: ^1.2.0
  meta: ^1.12.0
  googleapis: ^13.0.0
  yaml: ^3.1.2
  pub_semver: ^2.1.4
  json_annotation: ^4.12.0
  mongo_dart: ^0.10.0
  mime: ^1.0.5
  intl: ^0.19.0
  path: ^1.9.0
  collection: ^1.18.0
  shelf_cors_headers: ^0.1.5
dev_dependencies:
  test: ^1.25.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  shelf_router_generator: ^1.1.0
  chunked_stream: ^1.4.1
