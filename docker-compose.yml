services:
  mongo:
    image: mongo:6.0
    container_name: unpub_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_EXPOSED_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secretpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-dart_pub}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo_data:/data/db

  unpub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unpub_server
    restart: unless-stopped
    ports:
      - "${UNPUB_PORT:-4000}:4000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # MongoDB connection settings (individual credentials or full URI)
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-dart_pub}
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-secretpassword}
      - MONGO_AUTH_SOURCE=admin
      # Alternatively, you can directly set MONGO_URL / MONGODB_URI:
      # - MONGO_URL=mongodb://admin:secretpassword@mongo:27017/dart_pub?authSource=admin

      # Override uploader email for published packages
      - UNPUB_OVERRIDE_UPLOADER_EMAIL=${UNPUB_OVERRIDE_UPLOADER_EMAIL:-fake-uploader@unpub.local}

      # Server network & storage configuration
      - UNPUB_HOST=0.0.0.0
      - UNPUB_PORT=4000
      - UNPUB_PROXY_ORIGIN=${UNPUB_PROXY_ORIGIN:-http://localhost:4000}
      - UNPUB_DATA_DIR=/app/data
    volumes:
      - unpub_data:/app/data

volumes:
  mongo_data:
  unpub_data:
