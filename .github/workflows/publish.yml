name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run publish in dry-run mode'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      id-token: write # Mandatory for pub.dev OIDC authentication
      contents: write # Needed if creating a GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: unpub
        run: dart pub get

      - name: Verify analysis and formatting
        working-directory: unpub
        run: |
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .

      - name: Run tests
        working-directory: unpub
        run: dart test

      - name: Publish to pub.dev (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: unpub
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true' }}
        working-directory: unpub
        run: dart pub publish --force

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
