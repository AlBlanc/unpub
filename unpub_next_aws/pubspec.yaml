name: unpub_next_aws
description: A collection of modules to use for deploying unpub_next into AWS infrastructure. Fork of pd4d10/unpub with modernized dependencies and Dart 3 support.
version: 3.0.1
homepage: https://github.com/AlBlanc/unpub
repository: https://github.com/AlBlanc/unpub
issue_tracker: https://github.com/AlBlanc/unpub/issues
environment:
  sdk: ^3.8.0

dependencies:
  unpub_next: ^3.0.1
  minio: ^3.5.0
  http: ^1.2.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
  chunked_stream: ^1.4.1
  mockito: ^5.4.4
  build_runner: ^2.4.9
  path: ^1.9.0
  json_annotation: ^4.12.0

dependency_overrides:
  unpub_next:
    path: ../unpub
